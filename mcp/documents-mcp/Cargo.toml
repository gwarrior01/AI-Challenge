[package]
name = "documents-mcp"
version = "0.1.0"
edition = "2021"

[dependencies]
rmcp = { version = "3.4", default-features = false, features = [
    "server",
    "macros",
    "transport-streamable-http-server",
] }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
pdf-extract = "0.12"
sha2 = "0.10"
futures-util = "0.3"
llm-core = { path = "../../core" }
