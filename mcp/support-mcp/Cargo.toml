[package]
name = "support-mcp"
version = "0.1.0"
edition = "2021"

[dependencies]
rmcp = { version = "3.4", default-features = false, features = [
    "server",
    "macros",
    "transport-streamable-http-server",
] }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
