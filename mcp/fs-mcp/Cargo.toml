[package]
name = "fs-mcp"
version = "0.1.0"
edition = "2021"

[dependencies]
# Серверная часть rmcp: по умолчанию stdio (клиент сам запускает сервер
# дочерним процессом), с `--http` — Streamable HTTP, как у остальных своих серверов.
rmcp = { version = "3.4", default-features = false, features = [
    "server",
    "macros",
    "transport-io",
    "transport-streamable-http-server",
] }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "io-std", "fs", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# Обход файлов с учётом .gitignore.
ignore = "0.4"
globset = "0.4"
regex = "1"
# Unified diff накопленных изменений.
similar = "2"
