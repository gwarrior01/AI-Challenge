<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Challenger</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222b;
    --border: #2a2f3a;
    --text: #e6e8ee;
    --muted: #8b93a3;
    --accent: #6c8dff;
    --accent-2: #8a5cf6;
    --user-bubble: #2a3550;
    --assistant-bubble: #1e222b;
    --error: #ff6b6b;
    --radius: 14px;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    background:
      radial-gradient(1200px 600px at 10% -10%, rgba(108, 141, 255, 0.12), transparent),
      radial-gradient(1000px 500px at 100% 0%, rgba(138, 92, 246, 0.10), transparent),
      var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand-icon {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }

  .brand-text h1 {
    margin: 0;
    font-size: 16px;
    font-weight: 600;
  }

  .brand-text span {
    font-size: 12px;
    color: var(--muted);
  }

  .header-controls {
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
  }

  .session-stats {
    display: flex;
    gap: 16px;
    font-size: 12px;
    color: var(--muted);
  }

  .session-stats b {
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }

  .debug-check {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
    user-select: none;
  }

  .debug-check input {
    accent-color: var(--accent);
    cursor: pointer;
  }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .empty-state {
    margin: auto;
    text-align: center;
    color: var(--muted);
    max-width: 360px;
  }

  .empty-state .brand-icon {
    margin: 0 auto 12px;
  }

  .row {
    display: flex;
    width: 100%;
  }

  .row.user { justify-content: flex-end; }
  .row.assistant, .row.error { justify-content: flex-start; }

  .bubble {
    max-width: min(680px, 85%);
    padding: 12px 16px;
    border-radius: var(--radius);
    white-space: pre-wrap;
    word-wrap: break-word;
    line-height: 1.5;
    font-size: 14.5px;
  }

  .row.user .bubble {
    background: var(--user-bubble);
    border: 1px solid #3a4570;
    border-bottom-right-radius: 4px;
  }

  .row.assistant .bubble {
    background: var(--assistant-bubble);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }

  .row.error .bubble {
    background: rgba(255, 107, 107, 0.08);
    border: 1px solid rgba(255, 107, 107, 0.4);
    color: var(--error);
    border-bottom-left-radius: 4px;
  }

  .meta {
    display: block;
    margin-top: 6px;
    font-size: 11px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .debug {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--border);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  /* Author-правила всегда перебивают дефолтный [hidden]{display:none} браузера,
     поэтому явно возвращаем скрытие, когда атрибут hidden выставлен через JS. */
  .debug[hidden] {
    display: none;
  }

  .debug-section h4 {
    margin: 0 0 4px;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .debug-section pre {
    margin: 0;
    padding: 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 12px;
    line-height: 1.4;
    max-height: 220px;
    overflow: auto;
    white-space: pre-wrap;
    word-break: break-word;
    color: var(--text);
  }

  .typing {
    display: inline-flex;
    gap: 4px;
    align-items: center;
    padding: 4px 2px;
  }

  .typing span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--muted);
    animation: blink 1.2s infinite ease-in-out;
  }

  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes blink {
    0%, 80%, 100% { opacity: 0.25; transform: scale(0.85); }
    40% { opacity: 1; transform: scale(1); }
  }

  footer {
    border-top: 1px solid var(--border);
    padding: 16px 24px 20px;
    background: linear-gradient(to top, var(--bg) 60%, transparent);
  }

  .composer {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 8px 8px 8px 16px;
    max-width: 900px;
    margin: 0 auto;
    transition: border-color 0.15s ease;
  }

  .composer:focus-within {
    border-color: var(--accent);
  }

  textarea {
    flex: 1;
    resize: none;
    border: none;
    outline: none;
    background: transparent;
    color: var(--text);
    font-size: 14.5px;
    font-family: inherit;
    line-height: 1.5;
    max-height: 200px;
    min-height: 24px;
    padding: 8px 0;
  }

  textarea::placeholder { color: var(--muted); }

  button#send {
    border: none;
    border-radius: 10px;
    padding: 10px 18px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: white;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: opacity 0.15s ease, transform 0.05s ease;
    white-space: nowrap;
  }

  button#send:hover { opacity: 0.92; }
  button#send:active { transform: scale(0.97); }
  button#send:disabled { opacity: 0.4; cursor: not-allowed; }

  .hint {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    margin-top: 8px;
  }

  main::-webkit-scrollbar { width: 8px; }
  main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="brand-icon">✦</div>
    <div class="brand-text">
      <h1>Challenger</h1>
      <span>модель: __MODEL_NAME__</span>
    </div>
  </div>
  <div class="header-controls">
    <label class="debug-check">
      <input type="checkbox" id="debug-toggle">
      Показывать JSON запроса и ответа
    </label>
    <div class="session-stats">
      <span>Запросов: <b id="stat-requests">0</b></span>
      <span>Токены за сессию: <b id="stat-tokens">0</b></span>
    </div>
  </div>
</header>

<main id="chat">
  <div class="empty-state" id="empty-state">
    <div class="brand-icon" style="margin: 0 auto 12px;">✦</div>
    <p>Задайте вопрос — ответ и расход токенов появятся здесь.</p>
  </div>
</main>

<footer>
  <div class="composer">
    <textarea id="prompt" placeholder="Введите запрос... (Enter — отправить, Shift+Enter — новая строка)" rows="1"></textarea>
    <button id="send">Отправить</button>
  </div>
  <div class="hint">Enter — отправить · Shift+Enter — новая строка</div>
</footer>

<script>
const chatEl = document.getElementById('chat');
const emptyState = document.getElementById('empty-state');
const promptEl = document.getElementById('prompt');
const sendBtn = document.getElementById('send');
const statRequests = document.getElementById('stat-requests');
const statTokens = document.getElementById('stat-tokens');
const debugToggle = document.getElementById('debug-toggle');

let sessionRequests = 0;
let sessionTokens = 0;
let sending = false;

try {
  debugToggle.checked = localStorage.getItem('challenger-show-debug') === '1';
} catch (e) { /* localStorage недоступен — используем значение по умолчанию */ }

function applyDebugVisibility() {
  const visible = debugToggle.checked;
  document.querySelectorAll('.debug').forEach((el) => { el.hidden = !visible; });
}

debugToggle.addEventListener('change', () => {
  applyDebugVisibility();
  try {
    localStorage.setItem('challenger-show-debug', debugToggle.checked ? '1' : '0');
  } catch (e) { /* игнорируем */ }
});

function scrollToBottom() {
  chatEl.scrollTop = chatEl.scrollHeight;
}

function addRow(role, text) {
  emptyState.remove();
  const row = document.createElement('div');
  row.className = 'row ' + role;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  row.appendChild(bubble);
  chatEl.appendChild(row);
  scrollToBottom();
  return bubble;
}

function addTyping() {
  emptyState.remove();
  const row = document.createElement('div');
  row.className = 'row assistant';
  row.id = 'typing-row';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
  row.appendChild(bubble);
  chatEl.appendChild(row);
  scrollToBottom();
}

function removeTyping() {
  const row = document.getElementById('typing-row');
  if (row) row.remove();
}

function formatUsage(usage) {
  if (!usage) return 'токены: недоступно';
  return `токены: ${usage.prompt_tokens} + ${usage.completion_tokens} = ${usage.total_tokens}`;
}

function addDebugBlock(bubble, requestJson, responseJson) {
  const debug = document.createElement('div');
  debug.className = 'debug';
  debug.hidden = !debugToggle.checked;

  const reqSection = document.createElement('div');
  reqSection.className = 'debug-section';
  reqSection.innerHTML = '<h4>Запрос модели</h4>';
  const reqPre = document.createElement('pre');
  reqPre.textContent = requestJson || '(недоступно)';
  reqSection.appendChild(reqPre);

  const resSection = document.createElement('div');
  resSection.className = 'debug-section';
  resSection.innerHTML = '<h4>Ответ модели</h4>';
  const resPre = document.createElement('pre');
  resPre.textContent = responseJson || '(недоступно)';
  resSection.appendChild(resPre);

  debug.appendChild(reqSection);
  debug.appendChild(resSection);
  bubble.appendChild(debug);
}

function autoGrow() {
  promptEl.style.height = 'auto';
  promptEl.style.height = Math.min(promptEl.scrollHeight, 200) + 'px';
}

promptEl.addEventListener('input', autoGrow);

promptEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

sendBtn.addEventListener('click', send);

async function send() {
  const prompt = promptEl.value.trim();
  if (!prompt || sending) return;

  sending = true;
  sendBtn.disabled = true;
  promptEl.value = '';
  autoGrow();

  addRow('user', prompt);
  addTyping();

  try {
    const res = await fetch('/api/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt }),
    });
    const data = await res.json();
    removeTyping();

    if (!res.ok || data.error) {
      addRow('error', 'Ошибка: ' + (data.error || res.statusText));
    } else {
      const bubble = addRow('assistant', data.answer);
      const meta = document.createElement('span');
      meta.className = 'meta';
      meta.textContent = formatUsage(data.usage);
      bubble.appendChild(meta);
      addDebugBlock(bubble, data.requestJson, data.responseJson);
      scrollToBottom();

      sessionRequests += 1;
      if (data.usage && typeof data.usage.total_tokens === 'number') {
        sessionTokens += data.usage.total_tokens;
      }
      statRequests.textContent = sessionRequests;
      statTokens.textContent = sessionTokens;
    }
  } catch (e) {
    removeTyping();
    addRow('error', 'Ошибка сети: ' + e);
  } finally {
    sending = false;
    sendBtn.disabled = false;
    promptEl.focus();
  }
}
</script>
</body>
</html>
