<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Поддержка CloudDesk</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #677085; --line: #e2e5eb;
  --accent: #2f6fde; --user: #2f6fde; --user-text: #ffffff; --err: #c0392b; --err-soft: #fbeceb;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14171d; --panel: #1c2028; --text: #e4e7ee; --muted: #8f97a8; --line: #2c323d;
    --accent: #6b9cf0; --user: #3a68c2; --user-text: #ffffff; --err: #ef7b6e; --err-soft: #3a2220;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; }
.app { display: flex; flex-direction: column; height: 100vh; max-width: 860px; margin: 0 auto; }
header { padding: 12px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--line); }
h1 { font-size: 17px; margin: 0; flex: 1; }
button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 7px; padding: 6px 12px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button:disabled { opacity: .5; cursor: default; }
#feed { flex: 1; overflow-y: auto; padding: 20px 16px; }
.empty { color: var(--muted); text-align: center; margin-top: 40px; }
.msg { margin-bottom: 14px; }
.bubble { padding: 10px 14px; border-radius: 12px; }
.msg.user .bubble { background: var(--user); color: var(--user-text); margin-left: auto; width: fit-content; max-width: 80%; border-bottom-right-radius: 2px; white-space: pre-wrap; }
.msg.bot .bubble { background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 2px; max-width: 92%; }
.bubble p { margin: 0 0 8px; } .bubble p:last-child { margin-bottom: 0; }
.bubble ul, .bubble ol { margin: 4px 0 8px; padding-left: 22px; }
.bubble code { background: var(--bg); padding: 1px 4px; border-radius: 4px; font-size: 13px; }
.bubble.error { border-color: var(--err); background: var(--err-soft); }
.bubble.pending { color: var(--muted); }
.sources { font-size: 12.5px; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); color: var(--muted); }
form { display: flex; gap: 8px; padding: 12px 16px 16px; border-top: 1px solid var(--line); }
textarea { flex: 1; font: inherit; resize: none; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; background: var(--panel); color: var(--text); min-height: 42px; max-height: 160px; }
textarea:focus { outline: none; border-color: var(--accent); }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Поддержка CloudDesk</h1>
    <button id="reset" type="button">Новый разговор</button>
  </header>
  <div id="feed">
    <div class="empty" id="empty">Спросите о продукте или о своём обращении — например, «Тикет TCK-1001. Почему не работает авторизация?»</div>
  </div>
  <form id="form">
    <textarea id="q" rows="1" placeholder="Вопрос… (Enter — отправить, Shift+Enter — новая строка)"></textarea>
    <button class="primary" id="send">Спросить</button>
  </form>
</div>
<script>
const $ = (id) => document.getElementById(id);
let session = null, busy = false;

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

// Минимальный Markdown: абзацы, заголовки, списки, **жирный**, `код`.
function md(text) {
  const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>");
  let html = "", list = null;
  for (const raw of text.split("\n")) {
    const line = raw.trimEnd();
    const ul = line.match(/^\s*[-*•]\s+(.*)/), ol = line.match(/^\s*\d+[.)]\s+(.*)/);
    const kind = ul ? "ul" : ol ? "ol" : null;
    if (list && kind !== list) { html += `</${list}>`; list = null; }
    if (kind) { if (!list) { html += `<${kind}>`; list = kind; } html += `<li>${inline((ul || ol)[1])}</li>`; }
    else if (/^#+\s/.test(line)) html += `<p><b>${inline(line.replace(/^#+\s*/, ""))}</b></p>`;
    else if (line.trim()) html += `<p>${inline(line)}</p>`;
  }
  return list ? html + `</${list}>` : html;
}

function add(cls, html) {
  $("empty")?.remove();
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.innerHTML = html;
  $("feed").appendChild(div);
  $("feed").scrollTop = $("feed").scrollHeight;
  return div;
}

function renderReply(r) {
  const answer = r.answer.split(/\n\nИсточники:/)[0];
  const cited = r.sources.filter((s) => r.cited.includes(s.n));
  let html = `<div class="bubble">${md(answer)}`;
  if (cited.length) {
    html += `<div class="sources">Источники: ${cited.map((s) => `[${s.n}] ${esc(s.name.split("/").pop())}${s.section ? " › " + esc(s.section.split(" › ").pop()) : ""}`).join(" · ")}</div>`;
  }
  return html + `</div>`;
}

async function send(question) {
  if (busy || !question.trim()) return;
  busy = true; $("send").disabled = true;
  add("user", `<div class="bubble">${esc(question)}</div>`);
  const pending = add("bot", `<div class="bubble pending">Печатает…</div>`);
  try {
    const r = await fetch("/api/ask", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question, session_id: session }) });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || r.statusText);
    session = data.session_id;
    pending.innerHTML = renderReply(data);
  } catch (e) {
    pending.innerHTML = `<div class="bubble error">Ошибка: ${esc(e.message)}</div>`;
  } finally {
    busy = false; $("send").disabled = false;
    $("feed").scrollTop = $("feed").scrollHeight;
    $("q").focus();
  }
}

$("form").addEventListener("submit", (e) => { e.preventDefault(); const q = $("q").value; $("q").value = ""; $("q").style.height = "auto"; send(q); });
$("q").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); } });
$("q").addEventListener("input", () => { $("q").style.height = "auto"; $("q").style.height = Math.min($("q").scrollHeight, 160) + "px"; });
$("reset").addEventListener("click", () => {
  if (busy) return;
  if (session) fetch("/api/reset", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ session_id: session }) });
  session = null;
  $("feed").innerHTML = "";
  add("bot", `<div class="bubble">Новый разговор. Чем могу помочь?</div>`);
});
$("q").focus();
</script>
</body>
</html>
