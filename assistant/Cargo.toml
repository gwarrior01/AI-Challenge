[package]
name = "code-assistant"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "code-assistant"
path = "src/main.rs"

[dependencies]
llm-core = { path = "../core" }
ratatui = "0.28"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
futures-util = "0.3"
textwrap = "0.16"
# Разбор Markdown ответов для отрисовки в TUI (см. src/markdown.rs).
pulldown-cmark = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
